<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><link rel="manifest" href="manifest.webmanifest"><title>DSE Swing AI</title>
<style>
:root{--bg:#07111f;--card:#0f1d2f;--card2:#13243a;--muted:#8ea2b8;--text:#eef5ff;--good:#4ade80;--warn:#fbbf24;--bad:#fb7185;--line:#21364f;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}main{max-width:860px;margin:auto;padding:16px 14px 92px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.big{font-size:28px;font-weight:800}.muted{color:var(--muted)}button{border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.btn2{background:#19304b}.badge{padding:5px 8px;border-radius:999px;background:#163523;color:#9cf3b5;font-weight:700;font-size:12px}.warn{background:#3b2d0b;color:#ffd878}.bad{background:#431824;color:#ffb1be}.item{padding:9px 0;border-top:1px solid var(--line)}.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:fixed;bottom:0;left:0;right:0;background:#091626;border-top:1px solid var(--line);padding:8px;z-index:5}.bar button{background:#12253a;font-size:12px}.bar button.active{background:var(--blue)}.err{color:#ff9eac}.good{color:#8cf5a7}input{background:#0b1728;color:white;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;margin:5px 0}.chips{display:flex;gap:7px;overflow:auto;padding:4px 0}.chip{white-space:nowrap;background:#12253a;color:white;border-radius:999px;padding:8px 12px;border:1px solid var(--line)}.chip.on{background:#1d4ed8}.link{color:#7fb0ff;text-decoration:none;font-weight:700}.mono{font-family:ui-monospace,monospace;font-size:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small{font-size:12px}.section-title{font-size:18px;font-weight:800;margin-top:18px}.stock-row{cursor:pointer}.stock-row:hover{background:var(--card2)}.overlay{position:fixed;inset:0;background:rgba(2,8,18,.78);display:none;align-items:flex-end;justify-content:center;z-index:10}.sheet{width:min(860px,100%);max-height:92vh;overflow:auto;background:#0b1728;border-top-left-radius:20px;border-top-right-radius:20px;padding:16px}.close{background:#1e293b}
</style></head><body><main>
<div class="row"><div><div class="muted">DSE SWING AI MVP</div><div class="big">Decision Board</div><div class="muted small" id="date"></div></div><button onclick="runReport()" id="runBtn">Run DSE Daily Report</button></div>
<div id="status" class="card">Loading…</div>
<section id="content"></section>
</main>
<nav class="bar"><button data-page="home" onclick="show('home')">Home</button><button data-page="top10" onclick="show('top10')">Top 10</button><button data-page="a+" onclick="show('a+')">A+</button><button data-page="portfolio" onclick="show('portfolio')">Portfolio</button><button data-page="risk" onclick="show('risk')">Risk</button></nav>
<div class="overlay" id="overlay"><div class="sheet"><div class="row"><h2 id="sheetTitle">Stock</h2><button class="close" onclick="closeSheet()">Close</button></div><div id="sheetBody"></div></div></div>
<script>
const API=localStorage.getItem('dse_api')||'';
let report=null,currentPage='home';
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const money=n=>Number.isFinite(+n)?Number(n).toFixed(2):'—';
const pct=n=>Number.isFinite(+n)?(Number(n)*100).toFixed(1)+'%':'—';
function setupCard(x){return `<div class="card stock-row" onclick="openStock('${esc(x.symbol)}',${x.setup_id||'null'})"><div class="row"><div><b>${esc(x.symbol)}</b><div class="muted">${esc(x.setup)} · ${esc(x.confidence)}</div></div><span class="badge">${money(x.score)}/100</span></div><div class="split"><div class="item">Price<br><b>৳${money(x.price)}</b></div><div class="item">R:R<br><b>1:${money(x.rr)}</b></div></div><div class="split"><div class="item">Entry<br>৳${money(x.entry_low)}–${money(x.entry_high)}</div><div class="item">SL / Target<br>৳${money(x.stop_loss)} / ৳${money(x.target)}</div></div><div class="item small">RSI ${money(x.rsi)} · Relative Volume ${money(x.rel_volume)}×</div></div>`}
function setStatus(){const s=report?.stale?'<span class="err">STALE DATA</span>':'<span class="good">FRESH</span>';document.getElementById('status').innerHTML=`<div class="row"><b>${esc(report?.status||'NO_DATA')}</b><span>${s}</span></div><div class="muted small">Market: ${esc(report?.market_status||'UNKNOWN')} · Snapshot: ${esc(report?.snapshot?.fetched_at||'—')} · Scanned candidates: ${report?.universe_scanned??0}</div>`}
function render(page='home'){
 currentPage=page;document.querySelectorAll('.bar button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const c=document.getElementById('content'); if(!report){c.innerHTML='';return}
 if(page==='home')c.innerHTML=`<div class="grid"><div class="card"><div class="muted">Top 10</div><div class="big">${report.top10?.length||0}</div></div><div class="card"><div class="muted">A+</div><div class="big">${report.a_plus?.length||0}</div></div></div><div class="card"><div class="row"><div><b>Portfolio Heat</b><div class="muted">Open-position risk</div></div><span class="badge">${money(report.portfolio_heat)}%</span></div></div><div class="section-title">A+ / Best Setups</div>${(report.a_plus?.length?report.a_plus:report.top10?.slice(0,3)||[]).map(setupCard).join('')||'<div class="card">No validated setup.</div>'}`;
 if(page==='top10')c.innerHTML=`<div class="section-title">Top 10 Validated Setups</div><div class="muted small">Hard gates applied: Risk ≤ 5% · R:R ≥ 1:2</div>${(report.top10||[]).map(setupCard).join('')||'<div class="card">No validated setup.</div>'}`;
 if(page==='a+')c.innerHTML=`<div class="section-title">A+ Candidates</div><div class="muted small">Highest-ranked valid candidates; not automatic BUY orders.</div>${(report.a_plus||[]).map(setupCard).join('')||'<div class="card">No A+ setup.</div>'}`;
 if(page==='portfolio')c.innerHTML=`<div class="card"><div class="section-title">Portfolio</div><div class="muted">Current portfolio heat</div><div class="big">${money(report.portfolio_heat)}%</div><div class="item">Broker execution is not enabled in MVP.</div></div>`;
 if(page==='risk')c.innerHTML=`<div class="card"><div class="section-title">Risk Calculator</div><input id="cap" placeholder="Capital"><input id="rp" placeholder="Risk %" value="5"><input id="en" placeholder="Entry"><input id="st" placeholder="Stop"><input id="tg" placeholder="Target"><button onclick="calcRisk()">Calculate</button><div id="riskout" class="item muted">Enter values and calculate.</div></div>`;
}
async function getJSON(path,opts={}){const r=await fetch(API+path,opts);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.detail||('API '+r.status));return j}
async function load(){document.getElementById('date').textContent=new Date().toLocaleString('en-GB');try{report=await getJSON('/api/v1/daily-report');setStatus();render(currentPage)}catch(e){document.getElementById('status').innerHTML=`<div class="err">Backend unavailable: ${esc(e.message)}</div><div class="muted small">API: ${esc(API)}</div>`;document.getElementById('content').innerHTML='<div class="card">Start FastAPI first, then press Run DSE Daily Report.</div>'}}
async function runReport(){const b=document.getElementById('runBtn');b.disabled=true;b.textContent='Scanning…';
  if(window.DseNative&&window.DseNative.runDailyScan){document.getElementById('dseDataText').textContent='DSE Data: scanning 300+ universe…';window.onDseProgress=(s)=>{try{const p=JSON.parse(s);document.getElementById('dseDataText').textContent='DSE Scan: '+p.done+'/'+p.total+' · '+p.symbol}catch(e){}};window.onDseNativeScan=(s)=>{try{report=JSON.parse(s);setStatus();render(currentPage);document.getElementById('dseDataText').textContent='DSE Scan: '+(report.status||'DONE')+' · '+(report.valid_count||0)+' valid setups'}catch(e){document.getElementById('dseDataText').textContent='DSE Scan: invalid native response'}};window.DseNative.runDailyScan('window.onDseNativeScan');b.disabled=false;b.textContent='Run DSE Daily Report';return;}
  if(!API){alert('Mobile data layer unavailable.');b.disabled=false;b.textContent='Run DSE Daily Report';return;}
  try{const j=await getJSON('/api/v1/pipeline/refresh',{method:'POST'});report={...await getJSON('/api/v1/daily-report'),refresh:j};setStatus();render(currentPage)}catch(e){alert('Pipeline failed: '+e.message)}finally{b.disabled=false;b.textContent='Run DSE Daily Report'}}
async function openStock(symbol,setupId){const o=document.getElementById('overlay'),body=document.getElementById('sheetBody');o.style.display='flex';document.getElementById('sheetTitle').textContent=symbol;body.innerHTML='<div class="card">Loading live stock detail…</div>';try{const j=await getJSON('/api/v1/stocks/'+encodeURIComponent(symbol));body.innerHTML=`<div class="card"><div class="row"><b>Status</b><span class="badge">${esc(j.status)}</span></div><div class="split"><div class="item">Setup<br><b>${esc(j.setup||'—')}</b></div><div class="item">Score<br><b>${money(j.score)}/100</b></div></div><div class="split"><div class="item">Current<br><b>৳${money(j.market?.ltp??j.features?.close)}</b></div><div class="item">R:R<br><b>1:${money(j.risk_plan?.rr)}</b></div></div></div><div class="card"><b>Why selected</b>${Object.entries(j.score_parts||{}).map(([k,v])=>`<div class="item">${esc(k)} <span style="float:right">${money(v)}</span></div>`).join('')}</div><div class="card"><b>Risk Plan</b><div class="item">Entry: ৳${money(j.risk_plan?.entry_low)}–${money(j.risk_plan?.entry_high)}</div><div class="item">Stop: ৳${money(j.risk_plan?.stop_loss)}</div><div class="item">Target: ৳${money(j.risk_plan?.target)}</div></div>${setupId?`<div class="card"><button onclick="revalidate(${setupId},this)">Revalidate Setup</button><div id="rv" class="item muted">Live validation required before action.</div></div>`:'<div class="card muted">This candidate has no persisted setup id yet.</div>'}`}
catch(e){body.innerHTML=`<div class="card err">${esc(e.message)}</div>`}}
async function revalidate(id,btn){btn.disabled=true;btn.textContent='Revalidating…';try{const j=await getJSON('/api/v1/revalidate/'+id,{method:'POST'});document.getElementById('rv').innerHTML=`<b>${esc(j.status)}</b><div class="item">Reasons: ${(j.reasons||[]).map(esc).join(', ')||'none'}</div><div class="item">Current: ৳${money(j.current_price)} · R:R ${money(j.risk_plan?.rr)}</div>`}catch(e){document.getElementById('rv').innerHTML=`<span class="err">${esc(e.message)}</span>`}finally{btn.disabled=false;btn.textContent='Revalidate Setup'}}
function closeSheet(){document.getElementById('overlay').style.display='none'}
async function calcRisk(){try{const j=await getJSON('/api/v1/risk/calculate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({capital:+document.getElementById('cap').value,risk_percent:+document.getElementById('rp').value,entry:+document.getElementById('en').value,stop:+document.getElementById('st').value,target:+document.getElementById('tg').value})});document.getElementById('riskout').innerHTML=`Risk ৳${money(j.risk_amount)} · Qty ${j.position_size} · R:R ${money(j.rr)} · ${j.eligible?'<span class="good">ELIGIBLE</span>':'<span class="err">BLOCK</span>'}`}catch(e){document.getElementById('riskout').innerHTML=`<span class="err">${esc(e.message)}</span>`}}
function show(p){render(p)}
load();
</script><div id="dseDataStatus" style="position:fixed;left:12px;right:12px;bottom:72px;padding:12px;border-radius:12px;background:#111827;color:#fff;font-family:sans-serif;z-index:9999;display:flex;gap:10px;align-items:center;justify-content:space-between"><span id="dseDataText">DSE Data: not tested</span><button id="dseDataBtn" style="border:0;border-radius:8px;padding:8px 12px">Test Live Data</button></div>
<script>(function(){const text=document.getElementById('dseDataText'),btn=document.getElementById('dseDataBtn');window.onDseData=function(s){try{const r=JSON.parse(s);text.textContent='DSE Data: '+(r.status||'ERROR')+' · '+(r.row_count||0)+' rows · '+(r.source||'NONE')}catch(e){text.textContent='DSE Data: invalid response'}};btn.onclick=function(){text.textContent='DSE Data: connecting…';if(window.DseNative&&window.DseNative.fetchLatest)window.DseNative.fetchLatest('window.onDseData');else text.textContent='DSE Data: native layer unavailable'};})();</script>
</body></html>
